
targets:
  original: "price"
  log: "log_price"

paths:
  geo_paths:
    raw_zip_path: "data/tl_2025_us_zcta520/tl_2025_us_zcta520.shp"
    clean_zip_path: Path(raw_zip_path)

  output_paths:
    csv_paths:
      global_path: "global_outputs.csv"
      binned_path: "binned_outputs.csv"
      binned_path_raw: "binned_outputs_raw.csv"
      cv_path: "cv_path_outputs.csv"
      
      
features:
  numeric: &base_num
    - "accommodates"
    - "minimum_nights"
    - "bathrooms"
    - "review_scores_rating"
    - "bedrooms"
    - "calculated_host_listings_count_private_rooms"
    - "bath_per_accom"
    - "calculated_host_listings_count"
  categorical: &base_cat
    - "room_type"
    - "neighbourhood_group_cleansed"
    - "property_type_clean"
    - "hot_tub"
    - "ac"
    - "patio_balcony"
    - "life_size_games"
    - "has_pool"
    - "host_is_superhost"
    - "month"

models:
  sm_ols_model_1:
    features:
      categorical: *base_cat
      numeric: *base_num

  sm_ols_model_2:
    features:
      categorical:
        - "room_type"
        - "neighbourhood_group_cleansed"
        - "property_type_clean"
        - "hot_tub"
        - "ac"
        - "patio_balcony"
        - "life_size_games"
        - "has_pool"
        - "host_is_superhost"
        - "month"
        - "accommodates_cat"
        - "bathrooms_cat"
        - "minimum_nights_cat"
      numeric:
        - "review_scores_rating"
        - "bedrooms"
        - "calculated_host_listings_count_private_rooms"
        - "bath_per_accom"
        - "calculated_host_listings_count"
       
  hist_model_3:
    features:
      categorical: *base_cat
      numeric: *base_num
    hyperparameters:
      categorical_features: from_dtype
      random_state: 42
      l2_regularization: 5.0
      min_samples_leaf: 50
      learning_rate: 0.05
      max_iter: 200
      max_leaf_nodes: 20

  hist_model_4:
    features:
      categorical: *base_cat
      numeric: *base_num
    hyperparameters:
      loss: "gamma"
      categorical_features: from_dtype
      random_state: 42
      l2_regularization: 15.0
      min_samples_leaf: 40
      learning_rate: 0.08
      max_iter: 250
      max_leaf_nodes: 21
      max_features: 0.7
      early_stopping: True


evals:
  permutation_settings:
    n_repeats: 5
    random_state: 42
    n_jobs: -1
        
col_groups:
  col_keep_initial_drop: ['id', 'last_scraped', 'host_is_superhost', 'neighbourhood_cleansed',
                    'neighbourhood_group_cleansed', 'latitude', 'longitude',
                    'property_type', 'room_type', 'accommodates', 'bathrooms',
                    'bathrooms_text', 'bedrooms', 'beds', 'amenities', 'price',
                    'minimum_nights', 'availability_90', 'number_of_reviews',
                    'review_scores_rating', 'calculated_host_listings_count',
                    'calculated_host_listings_count_private_rooms',
                    'calculated_host_listings_count_shared_rooms', 'reviews_per_month']
            
  col_after_ftr_eng_to_keep: ['id', 'host_is_superhost', 'neighbourhood_cleansed','neighbourhood_group_cleansed', 
                            'room_type', 'accommodates','bathrooms', 'bedrooms', 'beds', 'price', 'minimum_nights',
                            'review_scores_rating', 'calculated_host_listings_count',
                            'calculated_host_listings_count_private_rooms', 'month','bed_per_accom', 'bath_per_accom',
                            'has_pool', 'hot_tub','free_parking', 'fireplace', 'ac', 'patio_balcony', 'life_size_games',
                            'minimum_nights_cat', 'accommodates_cat', 'bathrooms_cat','property_type_clean']

groups:
  cv_split_group: 'id'

